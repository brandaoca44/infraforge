services:
  db:
    image: postgres:16
    container_name: infraforge-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infraforge
    ports:
      - "5433:5432"
    volumes:
      - infraforge_pg_data:/var/lib/postgresql/data

volumes:
  infraforge_pg_data: